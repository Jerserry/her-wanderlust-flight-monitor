<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Her Wanderlust Path · Flight Monitor</title><style>
:root{--bg:#fff9fc;--ink:#453b43;--muted:#8a7d85}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px 18px}h1{font-size:clamp(28px,5vw,42px);margin:0}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:white;border:1px solid #f4e5ec;border-radius:18px;padding:18px;box-shadow:0 5px 18px #5a33400a}.route{font-size:20px;font-weight:700}.price{font-size:28px;font-weight:750;margin:8px 0}.muted{font-size:13px}.tag{display:inline-block;background:#fff0f6;border-radius:20px;padding:4px 10px;font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted)}</style></head><body><main><header><div class="sub">HER WANDERLUST PATH ✈️</div><h1>Flight Price Monitor</h1><p class="sub">从吉隆坡出发 · 机票价格追踪 · MYR 马币</p></header><section class="card"><b>监控状态</b><p id="updated" class="sub">读取数据中…</p><span class="muted">报价仅供参考，订票前请核实实时价格、行李和付款费用。</span></section><h2>航线价格</h2><section id="results" class="grid"><div class="card empty">尚未有监控数据。</div></section><p class="muted">Her Wanderlust Path · 价格由配置的航班 API 提供，不保证可订。</p></main><script>
fetch('./data/prices.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('updated').textContent='最后更新：'+(d.updated_at||'尚未更新');let root=document.getElementById('results');root.replaceChildren();if(!d.results?.length){root.innerHTML='<div class="card empty">暂时没有报价。请检查 API 设置、日期及航线。</div>';return}d.results.forEach(x=>{let c=document.createElement('article');c.className='card';let a=document.createElement('div');a.className='route';a.textContent=x.origin+' → '+x.destination;let b=document.createElement('div');b.className='price';b.textContent='RM '+Number(x.price).toFixed(2);let p=document.createElement('p');p.className='muted';p.textContent=x.departure_date+' 至 '+x.return_date;let t=document.createElement('span');t.className='tag';t.textContent=x.below_budget?'达到预算 ✓':'预算 RM '+Number(x.budget).toFixed(0);c.append(a,b,p,t);root.append(c)})}).catch(()=>{document.getElementById('updated').textContent='尚未生成数据；完成 API 设置并运行 GitHub Actions 后显示。'});
</script></body></html>
