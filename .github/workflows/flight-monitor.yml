name: SerpApi Automatic Flight Monitor
on:
  schedule:
    # Malaysia time (UTC+8): Tuesday, Wednesday, Friday and Saturday at 18:00.
    # GitHub Actions scheduled workflows use UTC.
    - cron: "0 10 * * 2,3,5,6"
permissions:
  contents: write
concurrency:
  group: her-wanderlust-flight-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check flight prices with SerpApi
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json
          git diff --cached --quiet || (git commit -m "Update flight price history" && git push)
