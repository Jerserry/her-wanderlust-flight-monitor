name: SerpApi Automatic Flight Monitor
on:
  schedule:
    # Malaysia time (UTC+8): Tuesday, Wednesday, Friday and Saturday at 18:00.
    # GitHub Actions scheduled workflows use UTC.
    - cron: "0 10 * * 2,3,5,6"
permissions:
  contents: write
# Shared with the manual Upscrape workflow to serialize active API/data-writer runs.
# GitHub keeps only one pending run per group; this is not a durable FIFO queue.
concurrency:
  group: hwp-flight-api-global
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate website route budget config
        run: python sync_route_config.py
      - name: Check flight prices with SerpApi
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add docs/data/prices.json docs/data/route_config.json .github/state/serpapi_cooldown.json
          git diff --cached --quiet || (git commit -m "Update flight price history" && git push)
