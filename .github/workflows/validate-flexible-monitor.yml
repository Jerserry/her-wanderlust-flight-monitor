name: Validate Flexible Flight Monitor

on:
  push:
    branches:
      - main
      - feature/flexible-date-monitoring
    paths:
      - "monitor.py"
      - "config/flexible_dates.json"
      - "config/routes.json"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "README.md"
      - ".github/workflows/validate-flexible-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile monitor.py
      - name: Check dashboard JavaScript syntax
        run: node --check docs/app.js
      - name: Check dashboard flexible-date elements
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          js = Path("docs/app.js").read_text(encoding="utf-8")
          assert 'id="flexibleSummary"' in html
          assert "function renderFlexibleSummary()" in js
          assert "价格趋势" not in html
          print("Dashboard checks passed.")
          PY
      - name: Check flexible date generation, rotation and route list
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import json
          import monitor

          pairs = monitor.flexible_candidates(date(2026, 11, 12))
          assert pairs, "No flexible date candidates were generated"
          assert all(5 <= item["trip_duration_days"] <= 14 for item in pairs)
          assert all(item["return_date"] > item["departure_date"] for item in pairs)
          assert all(
              (date.fromisoformat(item["return_date"]) - date.fromisoformat(item["departure_date"])).days
              == item["trip_duration_days"]
              for item in pairs
          )
          cursor = {}
          first, _ = monitor.choose_candidates({"destination": "BKK"}, pairs, cursor)
          second, _ = monitor.choose_candidates({"destination": "BKK"}, pairs, cursor)
          assert len(first) == 1 and len(second) == 1
          assert first != second, "Rotation did not advance to the next date pairs"
          assert cursor["BKK"] == 2

          route_config = json.loads(Path("config/routes.json").read_text(encoding="utf-8"))
          routes = route_config["routes"]
          destinations = [route["destination"] for route in routes]
          assert len(destinations) == 34, f"Expected exactly 34 budget destinations, got {len(destinations)}"
          assert len(set(destinations)) == len(destinations), "Duplicate destination airport codes found"
          assert all(
              isinstance(route.get("budget_myr"), (int, float)) and route["budget_myr"] > 0
              for route in routes
          ), "Every destination must have a positive MYR round-trip budget"
          allowed_baggage_rules = {
              "may_exclude_checked_baggage_disclose",
              "must_include_checked_baggage",
          }
          assert all(
              route.get("baggage_rule") in allowed_baggage_rules for route in routes
          ), "Every destination must have a valid checked-baggage rule"
          assert route_config.get("origin") == "KUL", "Budget routes must depart from KUL"
          assert route_config.get("currency") == "MYR", "Budget routes must use MYR"
          print(f"Validation passed: {len(destinations)} budget destinations; {len(pairs)} date combinations; rotation works.")
          PY
